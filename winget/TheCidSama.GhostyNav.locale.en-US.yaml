ShortDescription: A Dynamic Island style notch for Windows, with a pixel-ghost voice assistant.
Description: |-
  GhostyNav puts a small notch at the top of your screen. Click it for a control centre, media
  player, calendar and timer, system stats, clipboard history and app launcher. Closed, it shows
  volume and brightness, notifications, meetings, a microphone and camera light, and a shelf for
  files. Hold Ctrl+Alt to talk to a Gemini-powered assistant that can see what you circle on
  screen. It uses about 24 MB of memory while idle.
